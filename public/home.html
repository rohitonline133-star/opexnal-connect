<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opexnal - Home</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background-color: #000;
        color: #fff;
        padding-bottom: 60px;
      }

      /* Top Header */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #121212;
        position: sticky;
        top: 0;
        background: #000;
        z-index: 10;
      }
      .logo {
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(45deg, #a855f7, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .header-icons {
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .icon-btn {
        font-size: 22px;
        cursor: pointer;
      }

      /* Stories Section */
      .stories-container {
        display: flex;
        gap: 14px;
        padding: 12px 16px;
        overflow-x: auto;
        border-bottom: 1px solid #18181b;
        scrollbar-width: none;
      }
      .stories-container::-webkit-scrollbar {
        display: none;
      }
      .story-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: 68px;
      }
      .story-ring {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        padding: 2px;
        background: linear-gradient(
          45deg,
          #f09433,
          #e6683c 25%,
          #dc2743 50%,
          #cc2366 75%,
          #bc1888 100%
        );
      }
      .story-ring.my-story {
        background: transparent;
        position: relative;
      }
      .story-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #000;
        background: #27272a;
      }
      .add-btn {
        position: absolute;
        bottom: 2px;
        right: 2px;
        background: #000;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #000;
        color: #a855f7;
        font-weight: bold;
        font-size: 14px;
      }
      .username {
        font-size: 11px;
        color: #a1a1aa;
        width: 68px;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Post Feed */
      .post {
        border-bottom: 1px solid #18181b;
      }
      .post-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
      }
      .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1.5px solid #ec4899;
      }
      .user-name {
        font-size: 13px;
        font-weight: 600;
      }
      .audio-name {
        font-size: 11px;
        color: #a1a1aa;
      }
      .post-image-container {
        position: relative;
        width: 100%;
        background: #18181b;
      }
      .post-image {
        width: 100%;
        display: block;
        max-height: 500px;
        object-fit: cover;
      }
      .badge {
        position: absolute;
        top: 12px;
        right: 12px;
        background: rgba(0, 0, 0, 0.7);
        padding: 4px 8px;
        border-radius: 12px;
        font-size: 11px;
      }

      /* Post Actions */
      .post-actions {
        display: flex;
        justify-content: space-between;
        padding: 10px 16px;
      }
      .left-actions {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .action-icon {
        font-size: 22px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        font-weight: 600;
      }
      .post-time {
        font-size: 11px;
        color: #71717a;
        padding: 0 16px 12px;
      }

      /* Bottom Nav */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        width: 100%;
        background: #000;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid #18181b;
      }
      .nav-icon {
        font-size: 22px;
        color: #a1a1aa;
      }
      .nav-icon.active {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <!-- Top Header -->
    <div class="header">
      <div class="icon-btn">➕</div>
      <div class="logo">Opexnal</div>
      <div class="header-icons">
        <div class="icon-btn">❤️</div>
      </div>
    </div>

    <!-- Stories Bar -->
    <div class="stories-container">
      <div class="story-item">
        <div class="story-ring my-story">
          <div class="story-img"></div>
          <div class="add-btn">+</div>
        </div>
        <span class="username">Your story</span>
      </div>
      <div class="story-item">
        <div class="story-ring"><div class="story-img"></div></div>
        <span class="username">sandy_official</span>
      </div>
      <div class="story-item">
        <div class="story-ring"><div class="story-img"></div></div>
        <span class="username">sajrad_09</span>
      </div>
      <div class="story-item">
        <div class="story-ring"><div class="story-img"></div></div>
        <span class="username">sandeep.e</span>
      </div>
    </div>

    <!-- Feed Post Sample -->
    <div class="post">
      <div class="post-header">
        <div class="user-info">
          <div class="avatar" style="background: #3f3f46"></div>
          <div>
            <div class="user-name">miss__rhabi</div>
            <div class="audio-name">🎵 dj.gopal_ · Original audio</div>
          </div>
        </div>
        <div>•••</div>
      </div>
      <div class="post-image-container">
        <img
          class="post-image"
          src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600"
          alt="Post"
        />
        <div class="badge">1/2</div>
      </div>
      <div class="post-actions">
        <div class="left-actions">
          <span class="action-icon">❤️</span>
          <span class="action-icon">💬 44</span>
          <span class="action-icon">🔁 155</span>
          <span class="action-icon">✈️</span>
        </div>
        <span class="action-icon">🔖</span>
      </div>
      <div class="post-time">1 day ago</div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <div class="nav-icon active">🏠</div>
      <div class="nav-icon">🎥</div>
      <div class="nav-icon">➕</div>
      <div class="nav-icon">🔍</div>
      <div class="nav-icon">👤</div>
    </div>
  </body>
</html>
