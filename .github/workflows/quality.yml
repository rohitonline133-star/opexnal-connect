name: Opexnal quality checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"
      - "security/**"
      - "chore/**"

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check first-party API syntax
        run: npm run backend:check
      - name: Production build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Lint changed first-party files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            npm run lint
            exit $?
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base="$BEFORE_SHA"
          else
            base="HEAD^"
          fi

          mapfile -t changed < <(git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs')
          files=()
          for file in "${changed[@]}"; do
            case "$file" in
              src/*|backend/*|tests/*|*.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs)
                [[ "$file" == android/* ]] && continue
                [[ -f "$file" ]] && files+=("$file")
                ;;
            esac
          done

          if (( ${#files[@]} > 0 )); then
            printf 'Linting %s existing first-party files\n' "${#files[@]}"
            npx eslint "${files[@]}"
          else
            echo "No changed first-party JS/TS files; skipping targeted lint."
          fi
      - name: Unit and security tests
        run: npm test
      - name: Regenerate Android web assets
        run: npx cap sync android
      - name: Scan every tracked file at byte level
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import subprocess
          import sys

          encoded_terms = [
              "c3R1ZGlv", "Z29vZ2xl", "Z2VtaW5p", "b3BlbmFp",
              "Y2hhdGdwdA==", "bG92YWJsZQ==", "Y2xhdWRl",
              "YW50aHJvcGlj", "Y29waWxvdA==", "cGVycGxleGl0eQ==",
              "bWlzdHJhbA==", "Z3Jvaw==", "Y29oZXJl", "ZGVlcHNlZWs="
          ]
          terms = [base64.b64decode(value).lower() for value in encoded_terms]
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\\0")
          findings = []
          scanned = 0
          for raw_path in filter(None, paths):
              path = pathlib.Path(raw_path.decode("utf-8", "surrogateescape"))
              if not path.is_file():
                  continue
              scanned += 1
              name_bytes = raw_path.lower()
              try:
                  data = path.read_bytes().lower()
              except OSError as exc:
                  findings.append((str(path), "READ_ERROR:" + str(exc)))
                  continue
              for term in terms:
                  if term in name_bytes or term in data:
                      findings.append((str(path), term.decode("ascii")))
          print(f"Scanned {scanned} tracked files as raw bytes.")
          if findings:
              for path, term in findings:
                  print(f"MATCH {term}: {path}")
              sys.exit(1)
          print("No configured external-brand markers found in tracked file paths or raw file bytes.")
          PY
      - name: Commit regenerated Android assets
        if: github.event_name != 'pull_request' && github.ref_name == 'chore/remove-brand-traces'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/assets/public android/app/src/main/assets/capacitor.config.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Android assets without platform branding"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Android assets are already up to date."
          fi
