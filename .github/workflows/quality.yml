name: Opexnal quality checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"
      - "security/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (repository currently has no lockfile)
        run: npm install --no-audit --no-fund
      - name: Check first-party API syntax
        run: npm run backend:check
      - name: Production build (generates TanStack route types)
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Lint
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            npm run lint
            exit $?
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$BEFORE_SHA" != "" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          else
            base="HEAD^"
          fi

          git diff --name-only "$base"...HEAD > /tmp/changed-files.txt
          mapfile -t files < <(
            grep -E '^[^/]+\.(ts|tsx|js|jsx|mjs|cjs)$|^(src|backend|tests)/.*\.(ts|tsx|js|jsx|mjs|cjs)$' /tmp/changed-files.txt |
            grep -v '^android/' |
            grep -v '^android/app/src/main/assets/public/assets/' || true
          )

          if [ "${#files[@]}" -gt 0 ]; then
            printf 'Linting %s first-party files\n' "${#files[@]}"
            npx eslint "${files[@]}"
          else
            echo "No changed first-party JS/TS files; skipping targeted lint."
          fi
      - name: Unit and security tests
        run: npm test
