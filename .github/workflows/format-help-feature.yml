name: Format Help Center feature files
on:
  push:
    branches:
      - feature/instagram-parity-help-audit
    paths:
      - ".github/workflows/format-help-feature.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-parity-help-audit
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format feature files and remove temporary workflow
        run: |
          npx prettier --write src/lib/help-catalog.ts src/routes/_authenticated/help.tsx tests/settings-and-security.test.ts
          rm .github/workflows/format-help-feature.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/help-catalog.ts src/routes/_authenticated/help.tsx tests/settings-and-security.test.ts .github/workflows/format-help-feature.yml
          git commit -m "Format Help Center feature files and add inventory tests"
          git push
