name: Build Opexnal Play Store Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-release.yml

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)

      - name: Checkout Android wrapper source
        uses: actions/checkout@v4
        with:
          ref: feature/android-apk-capacitor
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install web and Capacitor dependencies
        run: npm install
      - name: Build production web assets
        run: npm run build
      - name: Generate clean Android project
        run: |
          rm -rf android
          npx cap add android
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Set Play Store version
        env:
          OPEXNAL_VERSION_CODE: ${{ github.run_number }}
          OPEXNAL_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          version_code = os.environ["OPEXNAL_VERSION_CODE"]
          version_name = os.environ["OPEXNAL_VERSION_NAME"]
          if not version_code.isdigit() or int(version_code) < 1:
              raise SystemExit("Invalid Play Store versionCode")
          source, code_count = re.subn(
              r"versionCode\\s+\\d+",
              f"versionCode {version_code}",
              source,
              count=1,
          )
          source, name_count = re.subn(
              r'versionName\\s+"[^"]+"',
              f'versionName "{version_name}"',
              source,
              count=1,
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName")
          gradle.write_text(source)
          print(f"Configured Play Store version {version_name} ({version_code})")
          PY
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$GITHUB_WORKSPACE/android/upload-keystore.jks"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64"
            exit 1
          fi
          if ! test -s "$GITHUB_WORKSPACE/android/upload-keystore.jks"; then
            echo "::error::Decoded keystore file is empty"
            exit 1
          fi
          if ! keytool -list -keystore "$GITHUB_WORKSPACE/android/upload-keystore.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not unlock this keystore"
            exit 1
          fi
          if ! keytool -list -keystore "$GITHUB_WORKSPACE/android/upload-keystore.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS was not found. Set the repository secret to the exact private-key alias."
            exit 1
          fi
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("GITHUB_WORKSPACE") + "/android/upload-keystore.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in source:
              source = re.sub(r"(android\s*\{)", r"\1" + signing, source, count=1)
          pattern = r"(buildTypes\s*\{\s*release\s*\{)"
          if not re.search(pattern, source):
              raise SystemExit("Could not find Android release buildType in generated Gradle file")
          source = re.sub(pattern, r"\1\n            signingConfig signingConfigs.release", source, count=1)
          gradle.write_text(source)
          PY
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
      - name: Build signed Play Store bundle
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace
      - name: Verify signed release outputs
        if: always()
        run: |
          if test -s android/app/build/outputs/apk/release/app-release.apk; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
            if test -z "$APKSIGNER"; then
              echo "::error::apksigner was not found under $SDK_ROOT/build-tools"
              exit 1
            fi
            "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          else
            echo "::warning::Signed APK was not produced"
          fi
          if test -s android/app/build/outputs/bundle/release/app-release.aab; then
            jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          else
            echo "::warning::Signed AAB was not produced"
          fi
      - name: Upload available release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opexnal-play-store-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30
