name: Format remediation branch

on:
  push:
    branches:
      - "fix/p0-authentication-security-20261022"

permissions:
  contents: write
  actions: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format changed supported files and commit formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          files="$(git diff --name-only origin/main...HEAD | grep -E '\\.(ts|tsx|js|jsx|mjs|cjs|json|md|yml|yaml|css|html|mdx)$' || true)"
          if [ -n "$files" ]; then
            npx prettier --write $files
          fi
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $files
            git commit -m "style: format first-party security remediation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/dispatches" \
            -d "{\"ref\":\"$GITHUB_REF_NAME\"}"
